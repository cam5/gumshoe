<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Off-scale tokens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "cta-a": "#017a07",
            "cta-b": "#018008"
          },
          spacing: {
            "9px": "9px",
            "10px": "10px",
            "14px": "14px",
            "15px": "15px",
            "17px": "17px",
            "18px": "18px"
          },
          borderRadius: {
            "33px": "33px",
            "34px": "34px"
          }
        }
      }
    };
  </script>
</head>
<body>
  <main id="main">
    <div id="buttons" class="flex gap-3">
      <a class="cta-a inline-block mt-14px py-9px px-17px rounded-33px bg-cta-a text-white underline" href="/start">Get started</a>
      <a class="cta-b inline-block mt-15px py-10px px-18px rounded-34px bg-cta-b text-white underline" href="/pricing">See pricing</a>
    </div>
  </main>
</body>
</html>
